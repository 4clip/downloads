<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Airo · página não encontrada</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060709">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script>
/* Mesmo idioma das outras páginas: escolha guardada ou idioma do navegador */
(function () {
  var lang = null;
  try { lang = localStorage.getItem("airo-site-lang"); } catch (e) { lang = null; }
  if (lang !== "pt" && lang !== "en") {
    var preferred = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    lang = /^pt\b/i.test(preferred) ? "pt" : "en";
  }
  document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
  if (lang === "en") document.title = "Airo · page not found";
})();
</script>
<!-- Caminhos absolutos: esta página aparece em qualquer endereço que não existe -->
<link rel="stylesheet" href="/assets/site.css">
<style>
html[lang="en"] [data-l="pt"], html[lang="pt-BR"] [data-l="en"] { display: none !important; }
body { min-height: 100vh; display: grid; place-items: center; padding: 32px var(--gutter); text-align: center; isolation: isolate; }
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 45% 50% at 25% 20%, rgba(34, 197, 94, .1), transparent 70%), radial-gradient(ellipse 45% 50% at 75% 20%, rgba(240, 68, 56, .12), transparent 70%);
}
main { display: grid; gap: 22px; justify-items: center; max-width: 36rem; }
.mark { width: 52px; height: auto; }
h1 { font: 600 clamp(38px, 7vw, 64px)/1.02 var(--font); letter-spacing: -.045em; text-wrap: balance; }
h1 em { color: #FFB4AB; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 85 64" aria-hidden="true">
    <circle cx="31" cy="31" r="22" fill="none" stroke="#E6E8EC" stroke-width="18"/>
    <rect x="44" y="0" width="18" height="62" rx="9" fill="#E6E8EC"/>
    <circle cx="76" cy="55" r="9" fill="#F04438"/>
  </svg>
  <span class="kicker"><span class="dot"></span>404</span>
  <h1><span data-l="pt">Esta página <em>saiu do ar.</em></span><span data-l="en">This page <em>went off air.</em></span></h1>
  <p class="lede"><span data-l="pt">O endereço não existe ou mudou de lugar.</span><span data-l="en">This address does not exist or has moved.</span></p>
  <div class="actions">
    <a class="btn btn-light" href="/"><span data-l="pt">Ir para o início</span><span data-l="en">Go to the home page</span></a>
    <a class="btn btn-ghost" href="/docs.html"><span data-l="pt">Ver a documentação</span><span data-l="en">See the documentation</span></a>
  </div>
</main>
</body>
</html>
