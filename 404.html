<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airo · página não encontrada</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<style>
  :root { color-scheme: dark; --bg: #0B0C0F; --fg: #E6E8EC; --fg-2: #9BA1AC; --line-2: #333844; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { display: grid; gap: 14px; justify-items: center; max-width: 36rem; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; }
  p { color: var(--fg-2); }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 10px; background: var(--fg); color: var(--bg); font-weight: 600; text-decoration: none; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="">
  <h1>Página não encontrada <span lang="en">· Page not found</span></h1>
  <p>O endereço não existe ou mudou de lugar. <span lang="en">This address does not exist or has moved.</span></p>
  <a href="/">Ir para o Airo <span lang="en">&nbsp;· Go to Airo</span></a>
</main>
</body>
</html>
